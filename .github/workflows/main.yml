name: A51 Building kernel

on:
  workflow_dispatch:
    inputs:
      COMPILER:
        description: 'compiler (file name in toolchains/ without .sh)'
        required: true
        default: 'Proton-Clang'
      KREPO:
        description: 'kernel repo'
        required: true
        default: 'https://github.com/xizyv/whitesu_kernel_samsung_universal9611'
      KBRANCH:
        description: 'kernel branch'
        required: true
        default: 'A17'
      DCFG:
        description: 'defconfig file name'
        required: true
        default: 'exynos9611-a51_defconfig'
      KSU:
        description: 'WhiteSU: non-root = clean kernel, white = with WhiteSU, both = build both'
        type: choice
        options:
          - non-root
          - white
          - both
        default: non-root
      SUFFIX:
        description: 'suffix for the zip filename'
        required: false
        default: ''
      NOTES:
        description: 'notes to send to telegram'
        required: false
        default: ''
      CONTAINER:
        description: 'build container image'
        required: true
        default: 'ubuntu:22.04'

env:
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  CHAT_ID: ${{ secrets.CHAT_ID }}
  REPO: ${{ github.event.inputs.KREPO }}
  KERNEL_BRANCH: ${{ github.event.inputs.KBRANCH }}
  COMPILERS: ${{ github.event.inputs.COMPILER }}
  PATCH_KSU: ${{ github.event.inputs.KSU }}
  DCFG: ${{ github.event.inputs.DCFG }}
  SUFFIX: ${{ github.event.inputs.SUFFIX }}
  NOTE: ${{ github.event.inputs.NOTES }}
  RUN_NUM: ${{ github.run_number }}_${{ github.run_attempt }}
  TZ: Asia/Ho_Chi_Minh

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ${{ github.event.inputs.CONTAINER }}
    defaults:
      run:
        shell: bash

    steps:
      - name: checkout builder
        uses: actions/checkout@v4

      - name: init build env
        run: |
          if command -v dnf >/dev/null 2>&1; then
            dnf group install development-tools -y
            dnf install which llvm lld bc bison ca-certificates curl flex glibc-devel.i686 glibc-devel binutils-devel openssl python3 python2 zstd clang gcc-arm-linux-gnu dtc libxml2 libarchive openssl-devel perl tomsfastmath-devel wget xz -y
            ln -sf "/usr/bin/python3" /usr/bin/python
          else
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
              zip cpio lz4 git curl wget xz-utils device-tree-compiler \
              python3 python-is-python3 ca-certificates libxml2 perl
          fi
          git config --global user.name "John Doe"
          git config --global user.email "idk@example.com"

      - name: start
        run: |
          echo WORKFLOW_START=$(date +"%s") >> $GITHUB_ENV
          bash tg_utils.sh msg "gh $RUN_NUM: workflow started (KSU mode: $PATCH_KSU)"
          if [ -n "$NOTE" ]; then
            bash tg_utils.sh msg "gh $RUN_NUM: $NOTE"
          fi

      - name: clone kernel source
        run: git clone --depth=1 --single-branch "$REPO" -b "$KERNEL_BRANCH" kernel

      - name: print kernel info
        run: |
          cd kernel
          source ../env
          bash ../tg_utils.sh msg "gh $RUN_NUM: kernel: ${kernel_name} ${kernel_ver}%nlgh $RUN_NUM: head: ${kernel_head}%nlgh $RUN_NUM: defconfig: ${defconfig}"

      - name: compile
        run: |
          cd kernel
          case "$PATCH_KSU" in
            "non-root" )
              bash ../build.sh "$COMPILERS"
            ;;
            "white" )
              bash ../ksu/white.sh
              bash ../build.sh "$COMPILERS"
            ;;
            "both" )
              bash ../build.sh "$COMPILERS"
              bash ../ksu/white.sh
              bash ../build.sh "$COMPILERS"
            ;;
          esac

      - name: show first errors
        if: ${{ failure() }}
        run: |
          grep -nE "error:|undefined reference|No such file|\*\*\* \[" kernel/*.log | head -30 || true

      - name: upload to telegram
        run: |
          cd kernel
          for file in *.zip ; do
            [ -e "$file" ] && bash ../tg_utils.sh up "${file}" "$(cat "${file}.info")"
          done
          for file in *.log ; do
            [ -e "${file}.info" ] && bash ../tg_utils.sh up "${file}" "$(cat "${file}.info")"
          done
          true

      - name: upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: kernel-a51-${{ github.run_number }}
          path: kernel/*.zip
          retention-days: 7
          if-no-files-found: error

      - name: upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: kernel/*.log
          if-no-files-found: ignore

      - name: finish
        if: ${{ always() }}
        run: |
          WDIFF=$(( $(date +"%s") - WORKFLOW_START ))
          bash tg_utils.sh msg "gh $RUN_NUM: workflow ${{ job.status }} in $((WDIFF / 60))m, $((WDIFF % 60))s"
